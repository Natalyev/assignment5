<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<style>
text { font-family: Arial, sans-serif; font-size: 16px; }
.title { font-size: 24px; font-weight: bold; }
.box { fill: white; stroke: black; stroke-width: 2; }
.head { font-weight: bold; }
.line { stroke: black; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.dash { stroke: black; stroke-width: 2; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow); }
</style>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
<path d="M0,0 L0,6 L9,3 z" fill="black"/>
</marker>
</defs>

<text x="30" y="35" class="title">Restaurant Kitchen - Assignment 4 UML</text>

<!-- Client -->
<rect x="40" y="80" width="180" height="80" class="box"/>
<text x="90" y="110" class="head">Client / Main</text>
<text x="60" y="140">CLI live demo</text>

<!-- Facades -->
<rect x="330" y="60" width="250" height="120" class="box"/>
<text x="380" y="90" class="head">RestaurantFacade</text>
<text x="350" y="120">+ placeOrder()</text>
<text x="350" y="145">+ beginOrder()</text>
<text x="350" y="170">+ continueOrder()</text>

<rect x="330" y="220" width="250" height="95" class="box"/>
<text x="365" y="250" class="head">RestaurantAdminFacade</text>
<text x="350" y="278">+ inspect()</text>
<text x="350" y="302">+ manualCompensate()</text>

<!-- Progress -->
