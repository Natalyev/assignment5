<text x="690" y="138">PENDING_B / PENDING_C</text>
<text x="690" y="164">COMPLETED / COMPENSATED</text>

<rect x="940" y="80" width="220" height="90" class="box"/>
<text x="965" y="110" class="head">ChainProgressRepository</text>
<text x="970" y="140">progress.csv</text>

<!-- Subsystem A -->
<rect x="40" y="400" width="320" height="300" class="box"/>
<text x="120" y="430" class="title">Subsystem A</text>
<text x="110" y="458" class="head">Order intake</text>

<rect x="65" y="480" width="125" height="70" class="box"/>
