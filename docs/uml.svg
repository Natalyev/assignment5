<text x="875" y="535">NEW/COMPLETED/CANCELLED</text>

<rect x="1010" y="480" width="125" height="70" class="box"/>
<text x="1030" y="510" class="head">BillingModule</text>

<rect x="865" y="580" width="125" height="70" class="box"/>
