<text x="505" y="458" class="head">Kitchen processing</text>

<rect x="465" y="480" width="125" height="70" class="box"/>
<text x="485" y="510" class="head">KitchenTask</text>
<text x="475" y="535">NEW/RESERVED/RELEASED</text>

<rect x="610" y="480" width="125" height="70" class="box"/>
<text x="620" y="505" class="head">CookingStation</text>
<text x="635" y="530" class="head">Allocator</text>

<rect x="465" y="580" width="125" height="70" class="box"/>
<text x="490" y="610" class="head">KitchenService</text>

